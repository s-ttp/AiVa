# http-level nginx settings shared by Space 1 (Control Center) and Space 3 (Context Lab); the /gateway/
# location written by gateway-proxy.sh relies on them.

# The visitor's address as HF's edge saw it: the rightmost X-Forwarded-For entry. HF keeps a client-sent
# X-Forwarded-For and appends its own hop on the right (verified 2026-10-15), so entries to its left are
# client-controlled and never used. X-Real-IP passes through from the client unchanged: never trusted.
map $http_x_forwarded_for $aiva_client_ip {
    default "";
    "~(?:^|,)\s*(?<aiva_hop>[0-9A-Fa-f:.]+)\s*$" $aiva_hop;
}

# The AiVa credential sent upstream as X-AiVa-Authorization (ADR-0019): the client's own
# X-AiVa-Authorization when it sends one, else its Authorization. A scripted client reaching a private Space
# needs Authorization for its HF token, so it sends the AiVa token in X-AiVa-Authorization (also the UI's
# fallback if HF's edge keeps Authorization for a private Space). Either way it is only the client's own
# credential, which the gateway verifies. An HF token (`hf_…`, with or without `Bearer`) is the client's
# platform access, never an AiVa credential: it is never forwarded.
map $http_x_aiva_authorization $aiva_credential_presented {
    "" $http_authorization;
    default $http_x_aiva_authorization;
}
map $aiva_credential_presented $aiva_credential {
    default $aiva_credential_presented;
    "~*(?:^|\s)hf_" "";
}

# Per-visitor limits on /gateway/ (the public front door): 5 requests/s with a burst of 20, at most 10
# concurrent requests. Without an X-Forwarded-For (local runs) the peer address is the key.
map $aiva_client_ip $aiva_rate_key {
    "" $binary_remote_addr;
    default $aiva_client_ip;
}
limit_req_zone $aiva_rate_key zone=aiva_gateway:10m rate=5r/s;
limit_conn_zone $aiva_rate_key zone=aiva_gateway_conn:10m;

# Access log without request headers or query strings: never Authorization, cookies or any X-AiVa-*.
# The last two fields are HF's RateLimit and RateLimit-Policy response headers on the /gateway/ hop
# (`"pages";r=0;t=212`, `"fixed window";"pages";q=400;w=300`). HF sends them only with its own 429, and
# they say which quota the hop is counted against (q=); "-" otherwise.
log_format aiva_safe '$time_iso8601 $aiva_client_ip "$request_method $uri" $status $body_bytes_sent '
                     '$request_time rl="$upstream_http_ratelimit" rlp="$upstream_http_ratelimit_policy"';

# Browsers navigating to a /gateway/ URL get the HTML "starting" page; API calls get JSON.
map $http_accept $aiva_wants_html {
    default 0;
    "~*text/html" 1;
}
