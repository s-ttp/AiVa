# AiVa Control Center static site on the Hugging Face Space port.
server {
    listen 7860;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log /dev/stdout aiva_safe;

    # nginx drops inherited add_header directives in any location that sets its
    # own, so each location repeats the security headers.

    # Server-side proxy to the private gateway Space, written at container start (gateway-proxy.sh). The
    # browser calls /gateway/ on this origin; the HF token stays in this container.
    include /var/run/aiva/gateway-proxy.conf;

    # Runtime configuration written at container start; never cache it.
    location = /config.js {
        alias /var/run/aiva/config.js;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Content-hashed build output.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Single-page app: unknown paths fall back to index.html for client routing.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
