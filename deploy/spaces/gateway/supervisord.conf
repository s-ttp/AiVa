; HF Space 2 process supervisor (run by entrypoint.sh as uid 1000). Every program logs to the container
; output; crashed programs restart. A program that keeps failing turns FATAL and fatal_listener.py stops
; the container, so the Space restarts instead of serving a half-working gateway. While a dependency is
; down or restarting, the gateway fails closed (LLD §17).

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=%(ENV_AIVA_RUN_DIR)s/supervisord.pid
loglevel=info

[unix_http_server]
file=%(ENV_AIVA_RUN_DIR)s/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_AIVA_RUN_DIR)s/supervisor.sock

[program:postgres]
command=postgres -D %(ENV_AIVA_PGDATA)s -c listen_addresses=127.0.0.1 -c port=5432
    -c unix_socket_directories=%(ENV_AIVA_RUN_DIR)s -c shared_buffers=256MB -c max_connections=100
priority=10
autorestart=true
startsecs=3
startretries=5
stopsignal=INT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
command=redis-server %(ENV_AIVA_RUN_DIR)s/redis.conf
priority=10
autorestart=true
startsecs=2
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:opa]
; OPA keeps the policy bundle in memory. After an OPA restart the watchdog's readiness probe makes the
; gateway re-push the published bundle; until then every policy evaluation fails closed.
command=opa run --server --addr 127.0.0.1:8181 --log-level error /app/policies/aiva/decision.rego
priority=10
autorestart=true
startsecs=2
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:gateway]
; Boot (wait, migrate, seed, models, traffic) runs once per container start, then uvicorn.
command=/app/deploy/gateway.sh
priority=20
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:front-door]
; nginx on the Space port, the only way in (ADR-0025). Started with the data services, so callers get the
; retryable GATEWAY_STARTING answer while the gateway boots.
command=/app/deploy/front-door.sh
priority=10
autorestart=true
startsecs=2
startretries=5
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:watchdog]
command=/app/deploy/watchdog.sh
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:backup]
; Database backups to the private bucket (db_backup.py, AIVA_BACKUP_BUCKET): a check right after boot, then
; every AIVA_BACKUP_INTERVAL_SECONDS (60), uploading only when the data changed, and once more when the
; container stops. Only if the boot restore restored a dump or found the bucket empty. supervisord stops the highest priority number first, so this final dump runs while Postgres is
; still up. Optional: it never stops the container (fatal_listener.py), and without a bucket it idles.
command=python /app/deploy/db_backup.py loop
priority=40
autorestart=true
startsecs=0
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[eventlistener:fatal]
command=python3 /app/deploy/fatal_listener.py
events=PROCESS_STATE_FATAL
priority=1
stdout_logfile=NONE
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
