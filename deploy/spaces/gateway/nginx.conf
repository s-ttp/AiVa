# HF Space 2 (gct-rlcd-gateway): the gateway's public front door (ADR-0025). nginx owns the Space port; the
# gateway listens on 127.0.0.1 only, so every request from outside passes the /gateway/ location written by
# gateway-proxy.sh: the proxy secret and the visitor's address are set here, the per-visitor limits and CORS
# for the Space 1 and Space 3 origins apply here. Runs as uid 1000 under supervisord.
worker_processes 1;
pid /tmp/aiva-nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    include /app/deploy/aiva-http.conf;
    # Generated at start by gateway-proxy.sh: the browser origins allowed to call /gateway/.
    include /tmp/aiva-nginx/gateway-cors.conf;
    access_log /dev/stdout aiva_safe;
    server_tokens off;
    client_body_temp_path /tmp/aiva-nginx/body;
    proxy_temp_path /tmp/aiva-nginx/proxy;
    fastcgi_temp_path /tmp/aiva-nginx/fastcgi;
    uwsgi_temp_path /tmp/aiva-nginx/uwsgi;
    scgi_temp_path /tmp/aiva-nginx/scgi;

    server {
        listen 7860;
        server_name _;

        # Generated at start by gateway-proxy.sh; holds the proxy secret, so it lives outside the image.
        include /tmp/aiva-nginx/gateway-proxy.conf;

        location = / {
            default_type text/plain;
            add_header X-Content-Type-Options "nosniff" always;
            return 200 "AiVa gateway (synthetic demo data). Open the AiVa Control Center to use it.\n";
        }

        # Nothing else is served: the gateway is reached under /gateway/ only.
        location / {
            default_type application/json;
            add_header X-Content-Type-Options "nosniff" always;
            return 404 '{"error":{"code":"NOT_FOUND","message":"Not found. The gateway API is under /gateway/.","retryable":false,"rule_ids":[],"run_id":null,"details":{}}}';
        }
    }
}
