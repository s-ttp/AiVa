[project]
name = "aiva-gateway"
version = "0.1.0"
description = "AiVa gateway: AI-PEL policy enforcement, RLCD routing, CIM orchestration, FinOps and telemetry"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20",
    "anthropic>=1.13",
    "asyncpg>=0.32",
    "en-core-web-md",
    "fastapi>=0.143",
    "google-genai>=2.30",
    "httpx>=0.28",
    "huggingface-hub>=1.0",
    "numpy>=2.2",
    "onnxruntime>=1.22",
    "openai>=3.31",
    "opentelemetry-api>=1.45",
    "opentelemetry-sdk>=1.45",
    "pgvector>=0.4",
    "presidio-analyzer>=2.2.364",
    "pydantic>=2.14",
    "pydantic-settings>=2.15",
    "pyjwt>=2.15",
    "python-docx>=1.2",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0",
    "redis>=8.1",
    "spacy>=3.8.16,<3.9",
    "sqlalchemy[asyncio]>=2.1",
    "tokenizers>=0.22",
    "uvicorn[standard]>=0.54",
]

[project.optional-dependencies]
# RLCD v1 (ModernBERT multi-head classifier, ADR-0009) runs in-process on CPU. Optional so CI and local
# development need neither the PyTorch wheel nor the 596 MB weights; without it the heuristic RLCD runs.
rlcd = [
    "safetensors>=0.7",
    "torch>=2.14,<2.15",
    "transformers>=5.19,<6",
]

[tool.uv.sources]
# English NLP model for Presidio NER (ADR-0011). spaCy models are published as GitHub release wheels.
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }
# CPU-only PyTorch: the gateway Space has no GPU, and the default index would pull the CUDA wheels.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
aiva-admin = "aiva_gateway.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiva_gateway"]
