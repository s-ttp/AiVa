runbooks:
  - id: RB-MW-001
    title: Microwave link down
    keywords: [microwave, link, down, hop, backhaul, synchronisation]
    steps: >-
      1. Confirm the hop alarm and the far-end synchronisation alarm. 2. Check the weather and power
      alarms at both ends. 3. Dispatch field engineering if the hop stays down for more than 30 minutes.
      4. Raise a P2 ticket and inform customer care with the affected sites and the expected restore time.
  - id: RB-SIG-002
    title: Signalling storm
    keywords: [signalling, storm, attach, core]
    steps: >-
      1. Identify the top attach sources. 2. Apply core rate limiting for the source. 3. Refer suspected
      SIM box lines to Fraud & Risk for review; line suspension needs a human decision. 4. Raise a P1 ticket.
  - id: RB-MW-003
    title: Microwave alarm flapping
    keywords: [microwave, flapping, errored, seconds]
    steps: >-
      1. Check the errored-seconds trend over 24 hours. 2. Schedule an alignment check. 3. Raise a P3
      ticket. Customer notices are only needed when availability drops below 90 percent.
