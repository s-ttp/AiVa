name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OPA_VERSION: "1.20.0"

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "${archive}" gitleaks
      # .gitleaks.toml: the default rules plus reviewed false positives. --redact keeps any match out of the log;
      # --verbose names the file, line and rule of a finding.
      - name: Scan
        run: ./gitleaks git --no-banner --redact --verbose --config .gitleaks.toml .

  gateway:
    name: Gateway, policies and contracts
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: aiva
          POSTGRES_PASSWORD: aiva
          POSTGRES_DB: aiva_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiva" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4.1-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AIVA_TEST_DATABASE_URL: postgresql+asyncpg://aiva:aiva@127.0.0.1:5432/aiva_test
      AIVA_DATABASE_URL: postgresql+asyncpg://aiva:aiva@127.0.0.1:5432/aiva_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
      - name: Install dependencies
        run: uv sync --all-packages --frozen --python 3.12
      - name: Install OPA
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL -o "$HOME/.local/bin/opa" "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x "$HOME/.local/bin/opa"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Policy format and tests
        run: |
          opa fmt --fail --list policies/
          opa test policies/ -v
      - name: Start OPA
        run: |
          opa run --server --addr 127.0.0.1:8181 --log-level error policies/aiva/decision.rego &
          sleep 2 && curl -sf http://127.0.0.1:8181/health
      - name: Tests (unit, integration, design-guarantee invariants, scenarios)
        run: uv run pytest -q
      - name: Migrations match models
        run: uv run alembic -c gateway/alembic.ini check
      - name: Contracts are up to date
        run: |
          uv run aiva-admin export-contracts
          git diff --exit-code contracts/

  web:
    name: Control Center
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - name: Typed web client matches contracts/openapi.json
        run: |
          pnpm -C web gen:api
          git diff --exit-code -- web/packages/api-client/src || {
            echo "::error::web/packages/api-client is stale: run 'pnpm -C web gen:api' and commit the result."
            exit 1
          }
      - run: pnpm -C web typecheck
      - run: pnpm -C web lint
      - run: pnpm -C web test
      - run: pnpm -C web build

  e2e:
    name: Control Center end-to-end (Playwright, axe)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: aiva
          POSTGRES_PASSWORD: aiva
          POSTGRES_DB: aiva
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiva" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4.1-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AIVA_DATABASE_URL: postgresql+asyncpg://aiva:aiva@127.0.0.1:5432/aiva
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: |
          uv sync --all-packages --frozen --python 3.12
          pnpm -C web install --frozen-lockfile
          pnpm -C web/apps/control-center exec playwright install --with-deps chromium
      - name: Start OPA
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL -o "$HOME/.local/bin/opa" "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x "$HOME/.local/bin/opa"
          "$HOME/.local/bin/opa" run --server --addr 127.0.0.1:8181 --log-level error policies/aiva/decision.rego &
          sleep 2 && curl -sf http://127.0.0.1:8181/health
      - name: Migrate and seed
        run: |
          uv run aiva-admin migrate
          uv run aiva-admin seed
      # The retrieval embedder (BAAI/bge-base-en-v1.5, ONNX) downloads from the Hugging Face Hub on first use.
      - name: Cache the pinned ONNX embedder
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-onnx-${{ hashFiles('gateway/src/aiva_gateway/optimize/embeddings.py') }}
      - name: Load the embedder once (downloads it on a cache miss)
        run: uv run python -c "from aiva_gateway.optimize.embeddings import OnnxEmbedder; OnnxEmbedder().embed(['warm'])"
      - name: Playwright tests against the local gateway
        run: pnpm -C web/apps/control-center e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/apps/control-center/playwright-report/
            web/apps/control-center/test-results/
          retention-days: 7

  images:
    name: Container images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build gateway
        run: docker build -f deploy/spaces/gateway/Dockerfile -t aiva-gateway .
      - name: Build Control Center
        run: docker build -f deploy/spaces/control-center/Dockerfile -t aiva-control-center .
      - name: Smoke-test gateway image (boot, local service auth, fail closed, crash recovery)
        run: bash deploy/spaces/gateway/smoke_test.sh aiva-gateway
