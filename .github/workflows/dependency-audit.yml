name: Dependency audit

# Known-vulnerability audit of the locked Python and web dependencies. Runs weekly and on pull requests
# that change a lockfile, so a newly published advisory does not turn unrelated pull requests red.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - uv.lock
      - pyproject.toml
      - "*/pyproject.toml"
      - web/pnpm-lock.yaml
      - .github/workflows/dependency-audit.yml

permissions:
  contents: read

jobs:
  python:
    name: Python (pip-audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
      # Runtime dependencies of the gateway, as locked. The spaCy model (a URL wheel) and the
      # CPU PyTorch build (download.pytorch.org) are not on PyPI, so pip-audit reports them as skipped.
      - name: Audit
        run: |
          uv export --frozen --all-packages --all-extras --no-dev --no-emit-workspace --no-hashes \
            -o "$RUNNER_TEMP/requirements.txt" >/dev/null
          uvx pip-audit==2.9.0 -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --progress-spinner off

  web:
    name: Web (pnpm audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Audit production dependencies
        run: pnpm -C web audit --prod
