# Tool registry for agentic workflows (LLD §7 Tools/agents; ADR-0012). Synthetic GCT systems only.
# `access: write` = the call has side effects. `egress: external` = the call sends data outside the
# GCT trust boundary. The registry is authoritative: callers cannot declare a tool's access or egress.
# Applications are granted tools in tenant.yaml (`allowed_tools`); policies can only restrict.
tools:
  - id: incident.lookup
    display_name: Incident lookup
    description: Read a service incident record from the synthetic ITSM.
    access: read
    egress: internal
  - id: network.site_status
    display_name: Cell site status
    description: Read current alarms and KPIs for synthetic cell sites.
    access: read
    egress: internal
  - id: kb.search
    display_name: Knowledge base search
    description: Search approved synthetic GCT knowledge articles.
    access: read
    egress: internal
  - id: ticket.create
    display_name: Create incident ticket
    description: Open a ticket in the synthetic ITSM queue for a service incident.
    access: write
    egress: internal
  - id: notification.draft
    display_name: Draft customer notice
    description: Save a draft customer notice in the synthetic CRM (not sent).
    access: write
    egress: internal
  - id: notification.send
    display_name: Send customer notice
    description: Send a notice to affected customers through the external SMS/email gateway.
    access: write
    egress: external
  - id: web.search
    display_name: Public web search
    description: Query a public search engine.
    access: read
    egress: external
  - id: subscriber.suspend
    display_name: Suspend subscriber
    description: Suspend a synthetic subscriber line in the provisioning system.
    access: write
    egress: internal
