# The ten locked synthetic GCT scenarios (LLD §15), then the live demo's use cases. Prompts are synthetic.
scenarios:
  - id: customer-support
    number: 1
    name: Customer Support Chatbot
    primary_proof: Long history, context pruning, tariff RAG, cache and savings
    application_id: gct-support-chatbot
    task_category: qa
    business_intent: billing-dispute
    declared_classification: internal
    routing_tags: [customer-support]
    context_profile: customer-support
    sample_prompt: Why did my synthetic GCT Prepaid Plus bill increase by 15 AED this month?
    # The default chat's evidence: the add-on passage that explains the increase (the scenario-1
    # fixture's KB, gateway/tests/fixtures/scenarios/kb_scenarios.jsonl; a test keeps the two identical).
    sample_evidence:
      - id: KB-TARIFF-020#0
        text: |-
          [KB-TARIFF-020 §1] Prepaid Plus add-ons (synthetic) - Streaming add-ons
          Synthetic GCT Prepaid Plus customers can add the StreamMax add-on for 25 AED per month. Since October 2026 every streaming add-on also carries the 15 AED digital services fee, shown as a separate line on the bill.
  - id: coding-assistant
    number: 2
    name: Coding Assistant
    primary_proof: Telecom automation generation, tests and policy-constrained models
    application_id: gct-coding-assistant
    task_category: coding
    business_intent: automation-script
    declared_classification: internal
    routing_tags: [coding]
    # The owner's choice: coding is served by the frontier model (only it qualifies for the critical tier).
    # Its thinking counts against the output budget: 4,096 truncated (ADR-0009, 2026-10-18 table).
    quality_tier: critical
    max_output_tokens: 6144
    sample_prompt: |-
      # Flag synthetic roaming CDRs that used more than 2 GB of data.
      import csv

      LIMIT_GB = 2


      def heavy_roaming(path):
          flagged = []
          with open(path, newline="") as f:
              for row in csv.DictReader(f):
                  used_gb = int(row["bytes_used"]) / 1024 ** 2
                  if row["roaming"] and used_gb > LIMIT_GB:
                      flagged.append(row["record_id"])
          return flagged
  - id: fraud-management
    number: 3
    name: Telecom Fraud Management
    primary_proof: Evidence chronology, confidential direct path, no punitive autonomous action
    application_id: gct-fraud-investigator
    task_category: analysis
    business_intent: sim-swap
    declared_classification: confidential
    routing_tags: [fraud-investigation]
    context_profile: fraud-investigation
    sample_prompt: >-
      Investigate synthetic SIM-swap alert FR-2026-0412 and summarise the evidence timeline.
      Recommend next steps for the analyst.
    # The default chat's evidence: the scenario-3 fixture's six alert events, in fixture order
    # (gateway/tests/fixtures/scenarios/fraud-management.json; a test keeps the two identical).
    sample_evidence:
      - id: FR-2026-0412/ev-3
        text: |-
          event_timestamp: 2026-10-12T09:14:05Z
          event_type: sim_swap_completed
          source_id: crm-retail-17
          note: New SIM activated in a retail store.
      - id: FR-2026-0412/ev-1
        text: |-
          event_timestamp: 2026-10-12T08:55:41Z
          event_type: password_reset
          source_id: app-auth
          note: Account password reset from a new device.
      - id: FR-2026-0412/ev-5
