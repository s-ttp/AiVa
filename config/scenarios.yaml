      Write a Python 3.12 function flag_roaming_overuse(path, cap_mb) that reads a synthetic CDR CSV with the
      columns record_id, subscriber_ref, session_date, roaming ("Y" or "N"), visited_country and bytes_used.
      For each subscriber_ref, return the record_ids of the roaming sessions that take that subscriber's
      roaming data for the day over cap_mb, with 1 MB as 1,000,000 bytes. Skip and count malformed rows (a
      missing or non-numeric bytes_used, or a roaming flag other than Y or N, in any case), and keep only the
      first row of a duplicated record_id. Then write one focused pytest test per case, using tmp_path for
      the CSV files. Keep the answer compact: the code and the tests, with brief comments and no extra
