    # Two more self-contained coding tasks: a query with its reasoning, and a bug hunt with tests.
    alternate_prompts:
      - >-
        Given this synthetic PostgreSQL schema: subscribers(subscriber_ref text primary key, segment text,
        activated_on date) and monthly_revenue(subscriber_ref text, month date, revenue_aed numeric), where
        month is the first day of the month. Write one SQL query that finds the subscribers whose average
        monthly revenue (ARPU) over the last three complete months fell by more than 20% against the three
        months before them. Count a missing month as zero revenue, and leave out subscribers activated less
        than six months ago. Then explain each step in one short line, and say which index would help it
        most. Keep the answer compact, with no extra explanation.
      - |-
        This synthetic token-bucket rate limiter for an SMS notification API has bugs. List each one in a
        single line (no table), then return a corrected, thread-safe version with at most six focused pytest
        tests that use an injected clock instead of sleeping. Keep the answer compact: brief comments and no
        extra explanation.

        import time


        class TokenBucket:
            def __init__(self, rate_per_s, capacity):
                self.rate = rate_per_s
                self.capacity = capacity
                self.tokens = 0
                self.updated = time.time()

            def allow(self, cost=1):
                now = time.time()
                self.tokens += (now - self.updated) * self.rate
                if self.tokens >= cost:
                    self.tokens -= cost
                    return True
                self.updated = now
                return False
