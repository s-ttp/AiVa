    sample_prompt: Draft a board summary of the synthetic Q3 network capex plan, preserving every figure.
    # Synthetic board-pack sources. Every critical figure is checked against its source passage when the
    # catalog loads, and the artifact checks verify each one survives into the generated document.
    sample_artifact:
      document_type: pptx
      title: Synthetic Q3 network capex board summary
      instructions: >-
        Draft a board summary of the synthetic Q3 network capex plan, preserving every figure. Use one
        section each for the headline, the spend split, phasing and risks, and the decision requested.
        Cite the source ID after each figure.
      evidence: &copilot-evidence
        - id: capex-plan#summary
