  - id: enterprise-rag
    number: 4
    name: Enterprise RAG
    primary_proof: Approved documents, citations, retrieval/context sufficiency
    application_id: gct-knowledge-portal
    task_category: rag
    business_intent: policy-lookup
    declared_classification: internal
    routing_tags: [enterprise-rag]
    context_profile: enterprise-rag
    # Its proof is citations, so it asks for one and runs at the high tier. RLCD serves the cheapest qualified
    # model (ADR-0009, 2026-10-22): Gemini Flash-Lite at standard, which cited GCT-POL-014 in 0 of 6 answers to
    # the bare question and 2 of 6 when asked; DeepSeek, the high tier's, cited it in 6 of 6 when asked
    # (measured live on S4's eight shipped passages, 2026-10-22).
    quality_tier: high
    sample_prompt: >-
      What is the approval process for a synthetic GCT enterprise roaming bundle discount? Cite the document
      and section you used.
  - id: network-operations
    number: 5
    name: Network Operations Intelligence
    primary_proof: Alarm correlation, high complexity, source integrity
    application_id: gct-noc-assistant
    task_category: analysis
    business_intent: incident-triage
    declared_classification: internal
    routing_tags: [network-operations]
    context_profile: network-alarm-correlation
    # Gemini Flash-Lite, the cheapest qualified model at standard (ADR-0009, 2026-10-22), lists every correlated
    # alarm with its time: 1,035 to 1,942 output tokens over three live takes, and at the default 1,024 it stopped
    # at max_tokens (2026-10-22). The sovereign model it replaced answered in about 600.
    max_output_tokens: 3072
    sample_prompt: >-
