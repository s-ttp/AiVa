          event_timestamp: 2026-10-12T09:31:22Z
          event_type: otp_requested
          source_id: bank-gw
          note: One-time passcode requested by a partner bank.
      - id: FR-2026-0412/ev-2
        text: |-
          event_timestamp: 2026-10-12T09:02:10Z
          event_type: sim_swap_requested
          source_id: crm-retail-17
